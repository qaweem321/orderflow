<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-row">
    <a routerLink="/" class="logo" aria-label="OrderFlow home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16l-1.5 9.5a2 2 0 01-2 1.5h-9a2 2 0 01-2-1.5L4 7zm4 0V5a4 4 0 018 0v2" /></svg>
      <span>OrderFlow</span>
    </a>
    <nav aria-label="Main" class="main-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Shop</a>
      @if (auth.isSignedIn()) {
        <a routerLink="/orders" routerLinkActive="active">My orders</a>
      }
      @if (auth.isAdmin()) {
        <a routerLink="/admin/products" routerLinkActive="active">Products</a>
        <a routerLink="/admin/orders" routerLinkActive="active">All orders</a>
      }
      <a routerLink="/cart" routerLinkActive="active">
        Cart @if (cart.count() > 0) {<span class="count" aria-label="items">{{ cart.count() }}</span>}
      </a>
    </nav>
    <div class="account">
      @if (auth.user(); as user) {
        <a routerLink="/settings" routerLinkActive="active">{{ user.displayName }}</a>
        <button type="button" class="link-button" (click)="auth.logout()">Sign out</button>
      } @else {
        <a routerLink="/settings" routerLinkActive="active">Settings</a>
        <a routerLink="/login" class="button">Sign in</a>
      }
    </div>
  </div>
</header>
<main id="main" class="container">
  <router-outlet />
</main>
